<button id="B71233594014006408">Create</button>
<script>
const subs = [];

let swallowUntil = 0;
const frameHtml = `<!doctype html><body>

<input type="checkbox" id="P7_CHECK"><button id="B71221230860006389">Submit</button>
<script>
const $=id=>document.getElementById(id);
addEventListener('keydown',e=>{if(e.key==='Escape')parent.postMessage({esc:1},'*')});

fill('P7_BU_GROUP_CODE_L1_ID',['SME OFFLINE','OTHER']);

$('P7_BU_GROUP_CODE_L3_ID').onchange=()=>fill('P7_BU_GROUP_CODE_L4_ID',['L4A']);

  const v=id=>$(id).value; const row=['P7_SERVICE_CODE_input','P7_SERVICE_DESCRIPTION_input','P7_MERCHANT_input','P7_BU_GROUP_CODE_L1_ID','P7_BU_GROUP_CODE_L2_ID','P7_BU_GROUP_CODE_L3_ID','P7_BU_GROUP_CODE_L4_ID','P7_BU_GROUP_CODE_L5_ID','P7_BU_GROUP_CODE_L6_ID','P7_GROUP_CODE_L1_ID','P7_NEWVERTICAL_ID','P7_SPECIALPROJECT_ID'].map(v).map(s=>s.trim());

};
<\/script></body>`;
addEventListener('message',e=>{ if(e.data.esc){ if(location.hash.includes('esc')){const f=document.querySelector('iframe');f&&f.remove()} return;} if(!e.data.row)return;
  if(location.hash.includes('outcomes')){
    const code=e.data.row[0];
    const closeDialog=()=>setTimeout(()=>{const f=document.querySelector('iframe');f&&f.remove()},200);
    if(subs.some(r=>r[0]===code)){ e.source.postMessage({err:'Service Code '+code+' already exists.'},'*'); return; }
    if(code.startsWith('REJ')){ closeDialog(); showAlert('danger','Merchant is not allowed for this category.'); return; }
    subs.push(e.data.row); document.title='submitted:'+JSON.stringify(subs); closeDialog();
    if(!code.startsWith('SIL')) showAlert('success','Row created.');
    return;
  } subs.push(e.data.row); document.title='submitted:'+JSON.stringify(subs); swallowUntil = Date.now() + 1500;
  setTimeout(()=>document.querySelector('iframe').remove(),200)});
addEventListener('keydown',e=>{if(e.key==='Escape'&&location.hash.includes('esc')){const f=document.querySelector('iframe');f&&f.remove()}});
document.getElementById('B71233594014006408').onclick=()=>{ if(document.querySelector('iframe'))return; if(location.hash.includes('swallow') && Date.now() < swallowUntil) return;

</script></body></html>
