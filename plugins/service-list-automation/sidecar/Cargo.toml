[package]
name = "devtool-svc-service-list-automation"
version = "0.1.0"
edition = "2021"
publish = false
description = "DevTool Tier-B sidecar for the service-list-automation plugin — JSONL over stdio, drives a user-logged-in Chrome over CDP."

[[bin]]
name = "devtool-svc-service-list-automation"
path = "src/main.rs"

[dependencies]
csv = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
