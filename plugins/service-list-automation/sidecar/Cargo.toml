[package]
name = "devtool-svc-service-list-automation"
version = "0.1.0"
edition = "2021"
publish = false
description = "DevTool Tier-B sidecar for the service-list-automation plugin — JSONL over stdio, see docs/plugin-sdk/04-tier-b-sidecars.md in developer-desktop-utils."

[[bin]]
name = "devtool-svc-service-list-automation"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = "thin"
strip = true
panic = "abort"
